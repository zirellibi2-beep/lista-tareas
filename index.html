<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-
scale=1.0">

    <title>To-Do List App - Práctica de Laboratorio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="to-do-app">
            <h2>Lista de Tareas <img src="images/icon1.png" alt="Icono de
tareas"></h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Añade tu
 tarea aquí...">
                <button onclick="addTask()">Añadir</button>
            </div>
            <ul id="list-container">
                <!-- Las tareas agregadas dinámicamente mediante
JavaScript aparecerán aquí -->
            </ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
